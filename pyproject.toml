[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-novel-text-to-speech"
version = "0.1.0"
description = "Desktop app for converting visual novel text to speech"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Eugene" },
    { name = "Alex" },
]

dependencies = [
    # Core
    "coqui-tts[codec]>=0.27.5,<0.28",
    "sounddevice>=0.5.6,<0.6",
    "mss>=10.2,<11",
    "pyobjc-framework-quartz>=12.2.2,<13 ; sys_platform == 'darwin'",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pynput>=1.8.2,<2",
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
    "torchcodec>=0.16,<0.17",
    # Coqui XTTS 0.27.5 imports an API removed in Transformers 5.
    "transformers>=4.57.6,<5",
    "pytesseract>=0.3.13",
    "numpy>=2.5,<3",
    "soundfile>=0.14,<0.15",
    "platformdirs>=4.11,<5",
    "psutil>=7.2.2,<8",
    "reverse1999-extractor",
    # Inteface
    "PySide6==6.11.2",
    # Needs eSpeak to run
    # "pyttsx3>=2.90",
    "vntts-artifacts[audio]",
    "durable-file",
]

[project.optional-dependencies]
rapidocr = [
    "rapidocr>=3.8.1,<4",
    "onnxruntime>=1.29,<2",
]
speaker-identity = [
    "speechbrain==1.1.1",
]

[project.scripts]
vntts = "vntts.main:main"
vntts-app = "vntts.app:main"
vntts-calibrate = "vntts.calibration:main"
vntts-benchmark-ocr = "vntts.ocr_benchmark:main"
vntts-benchmark-tts = "vntts.tts_benchmark:main"
vntts-benchmark-models = "vntts.authoring.model_benchmark:main"
vntts-cuda-probe = "vntts.cuda_probe:main"
vntts-listen = "vntts.authoring.listening_cli:main"
vntts-reference-review = "vntts.authoring.source_reference_quality:main"
vntts-reference-composite = "vntts.authoring.reference_composite:main"
vntts-replay-live = "vntts.live_replay:main"
vntts-capture-live-replay = "vntts.live_replay_capture:main"
vntts-recover-live-replay-capture = "vntts.live_replay_capture_recover:main"
vntts-seal-live-replay = "vntts.live_replay_sequence_seal:main"
vntts-audit-live-replay-coverage = "vntts.live_replay_coverage:main"
vntts-check-reference = "vntts.reference_quality:main"
vntts-preflight-game-pack = "vntts.game_pack:main"
vntts-pregenerate = "vntts.authoring.cli:main"
vntts-authoring-workbench = "vntts.authoring.workbench_ui:main"
vntts-review-bundle = "vntts.authoring.cohort_bundle_ui:main"
vntts-review-rejected-reasons = "vntts.authoring.legacy_reason_review_ui:main"
vntts-reference-audit = "vntts.authoring.failure_reference_audit_ui:main"
vntts-authoring-reconcile = "vntts.authoring.reconciliation_cli:main"
vntts-conflict-review = "vntts.authoring.terminal_conflict_review_ui:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
vntts-artifacts = { git = "https://github.com/AlexRedby/vntts-artifacts.git", rev = "ff1413f4ee3fc5a0f221454552175e261358b450" }
reverse1999-extractor = { git = "https://github.com/AlexRedby/r1999-extractor.git", rev = "1a5133ec56fa497cfecb78fd22c8b3ce1cb640a1" }

durable-file = { git = "https://github.com/AlexRedby/vntts-artifacts.git", rev = "0e22c629dde9de070eb7f13c87609e5905277ab9" }

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "nbstripout>=0.9.1,<1",
    "pyinstaller>=6.22,<7",
    "ruff>=0.16.5,<0.17",
]
notebook = [
    "jupyter>=1.1",
    "matplotlib>=3.9.4",
    "numpy>=1.24",
    "pandas>=1.5",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["vntts*"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["exps", "README.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = [
    "B004", "B006", "B007", "B008", "B012", "B014", "B015", "B018",
    "B019", "B020", "B026", "B904", "B905", "RUF012", "RUF059", "W605",
]

[tool.mypy]
python_version = "3.14"
files = ["vntts"]
follow_imports = "normal"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
