[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-novel-text-to-speech"
version = "0.1.0"
description = "Desktop app for converting visual novel text to speech"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Eugene" },
    { name = "Alex" },
]

dependencies = [
    # Core
    "coqui-tts>=0.27.3",
    "sounddevice>=0.5.3",
    "mss>=10.1.0",
    "pyobjc-framework-quartz>=10.3 ; sys_platform == 'darwin'",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pynput>=1.8.1",
    "torch<2.9",
    "torchaudio<2.9",
    "transformers==4.57.3",
    "pytesseract>=0.3.13",
    "numpy>=1.24",
    "platformdirs>=4.3,<5",
    "reverse1999-extractor",
    # Inteface
    "PySide6==6.10.1",
    # Needs eSpeak to run
    # "pyttsx3>=2.90",
    "vntts-artifacts[audio]",
]

[project.optional-dependencies]
rapidocr = [
    "rapidocr>=3.8.1,<4",
    "onnxruntime>=1.23,<2",
]

[project.scripts]
vntts = "vntts.main:main"
vntts-app = "vntts.app:main"
vntts-calibrate = "vntts.calibration:main"
vntts-benchmark-ocr = "vntts.ocr_benchmark:main"
vntts-benchmark-tts = "vntts.tts_benchmark:main"
vntts-benchmark-models = "vntts.authoring.model_benchmark:main"
vntts-listen = "vntts.authoring.listening_cli:main"
vntts-reference-review = "vntts.authoring.source_reference_quality:main"
vntts-reference-composite = "vntts.authoring.reference_composite:main"
vntts-replay-live = "vntts.live_replay:main"
vntts-capture-live-replay = "vntts.live_replay_capture:main"
vntts-recover-live-replay-capture = "vntts.live_replay_capture_recover:main"
vntts-seal-live-replay = "vntts.live_replay_sequence_seal:main"
vntts-audit-live-replay-coverage = "vntts.live_replay_coverage:main"
vntts-check-reference = "vntts.reference_quality:main"
vntts-preflight-game-pack = "vntts.game_pack:main"
vntts-pregenerate = "vntts.authoring.cli:main"
vntts-authoring-workbench = "vntts.authoring.workbench_ui:main"
vntts-review-bundle = "vntts.authoring.cohort_bundle_ui:main"
vntts-reference-audit = "vntts.authoring.failure_reference_audit_ui:main"
vntts-authoring-reconcile = "vntts.authoring.reconciliation_cli:main"
vntts-conflict-review = "vntts.authoring.terminal_conflict_review_ui:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
vntts-artifacts = { git = "https://github.com/AlexRedby/vntts-artifacts.git", rev = "dd0459df41d596d649a5a3e33fb03f93024d5af9" }
reverse1999-extractor = { git = "https://github.com/AlexRedby/r1999-extractor.git", rev = "08cee9d36d05cabe6186cb85119e1a66b2b000cb" }

[dependency-groups]
dev = [
    "deptree>=0.0.12",
    "mypy>=1.19,<2",
    "nbstripout>=0.8.2",
    "pyinstaller",
    "ruff==0.16.2",
]
notebook = [
    "jupyter>=1.1",
    "matplotlib>=3.9.4",
    "numpy>=1.24",
    "pandas>=1.5",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["vntts*"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["exps", "README.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
    "vntts/authoring/cli_dispatch.py",
    "vntts/controller_components.py",
    "vntts/game_pack.py",
    "vntts/live_snapshot.py",
    "vntts/live_speech.py",
    "vntts/playback.py",
    "vntts/speech_worker_messages.py",
    "vntts/synthesis.py",
]
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
