[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-novel-text-to-speech"
version = "0.1.0"
description = "Desktop app for converting visual novel text to speech"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Eugene" },
    { name = "Alex" },
]

dependencies = [
    # Core
    "coqui-tts>=0.27.3",
    "sounddevice>=0.5.3",
    "mss>=10.1.0",
    "pyobjc-framework-quartz>=10.3 ; sys_platform == 'darwin'",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pynput>=1.8.1",
    "torch<2.9",
    "torchaudio<2.9",
    "transformers==4.57.3",
    "pytesseract>=0.3.13",
    "cryptography>=46.0.5",
    "numpy>=1.24",
    # Inteface
    "PySide6>=6.6",
    # Needs eSpeak to run
    # "pyttsx3>=2.90",
]

[project.scripts]
vntts = "vntts.main:main"
vntts-app = "vntts.app:main"
vntts-calibrate = "vntts.calibration:main"
vntts-wwise-extract = "vntts.game_audio_cli:extract_main"
vntts-audio-convert = "vntts.game_audio_cli:convert_main"
vntts-reverse1999-voice = "vntts.reverse1999_voice_import:main"
vntts-reverse1999-index = "vntts.reverse1999_index:main"
vntts-reverse1999-config = "vntts.reverse1999_config:main"
vntts-reverse1999-audition = "vntts.reverse1999_audition_ui:main"
vntts-audio-score = "vntts.voice_reference_quality:main"
vntts-reverse1999-batch = "vntts.reverse1999_batch:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "deptree>=0.0.12",
    "nbstripout>=0.8.2",
    "pyinstaller",
    "ruff>=0.14",
]
notebook = [
    "jupyter>=1.1",
    "matplotlib>=3.9.4",
    "numpy>=1.24",
    "pandas>=1.5",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["vntts*"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["exps", "README.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
