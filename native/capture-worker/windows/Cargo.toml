[package]
name = "vntts-capture-worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_System_Performance", "Win32_System_Threading",
    "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_Memory",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"
] }
