[project]
name = "vntts-chatterbox-nano-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
    "platformdirs>=4.3,<5",
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@ce86c49d029f42272c1902eccb675556b9ed2330",
    "scipy>=1.11,<2",
    "vntts-artifacts[audio]",
]

[tool.uv]
package = false

[tool.uv.sources]
vntts-artifacts = { git = "https://github.com/AlexRedby/vntts-artifacts.git", rev = "dd0459df41d596d649a5a3e33fb03f93024d5af9" }
