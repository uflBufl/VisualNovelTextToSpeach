[project]
name = "vntts-pocket-tts-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pocket-tts==2.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
