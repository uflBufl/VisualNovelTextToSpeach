[project]
name = "vntts-pocket-tts-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "platformdirs>=4.3,<5",
    "pocket-tts==2.1.0",
    "scipy>=1.11,<2",
    "vntts-artifacts[audio]",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
vntts-artifacts = { git = "https://github.com/AlexRedby/vntts-artifacts.git", rev = "dd0459df41d596d649a5a3e33fb03f93024d5af9" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
