[project]
name = "vntts-moss-soundeffect-v2-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "moss-soundeffect-v2 @ git+https://github.com/OpenMOSS/MOSS-TTS.git@c0880299e8b8d0f7119efab17e4e776fffe7b8fa#subdirectory=moss_soundeffect_v2",
    "torch==2.9.0+cu128 ; sys_platform == 'linux'",
    "torchaudio==2.9.0+cu128 ; sys_platform == 'linux'",
    "torchcodec==0.8.0 ; sys_platform == 'linux'",
    "torchvision==0.24.0+cu128 ; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
