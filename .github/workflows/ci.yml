name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Audit locked dependencies
        run: python scripts/dependency_audit.py

  speech-runtime-smoke:
    name: Runtime ${{ matrix.backend }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {backend: pocket-tts, os: macos-15}
          - {backend: pocket-tts, os: windows-latest}
          - {backend: pocket-tts, os: ubuntu-latest}
          - {backend: moss-tts, os: macos-15}
          - {backend: chatterbox-nano, os: windows-latest}
          - {backend: chatterbox-nano, os: ubuntu-latest}
          - {backend: moss-tts-delay, os: windows-latest}
          - {backend: moss-tts-delay, os: ubuntu-latest}
          - {backend: qwen-tts, os: windows-latest}
          - {backend: moss-soundeffect-v2, os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install locked runtime dependencies
        run: uv sync --project backends/${{ matrix.backend }} --locked --python 3.14 --no-dev

      - name: Check imports and CPU-host refusal without model weights
        timeout-minutes: 5
        run: >-
          uv run --project backends/${{ matrix.backend }} --no-sync
          python -m scripts.smoke_speech_runtime ${{ matrix.backend }}
          --output runtime-smoke.json
          ${{ matrix.backend == 'moss-tts' && '--allow-unavailable-metal' || '' }}
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

      - name: Preserve runtime smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-${{ matrix.backend }}-${{ matrix.os }}
          path: runtime-smoke.json
          if-no-files-found: warn

  quality:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Check runtime locks and binary wheels
        run: python scripts/dependency_report.py

      - name: Install native dependencies
        run: brew install tesseract espeak-ng

      - name: Install locked dependencies
        run: uv sync --group dev --frozen

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check static types
        run: uv run --frozen mypy

      - name: Check complexity ratchet
        run: uv run --frozen python scripts/check_ruff_complexity.py

      - name: Run unit tests
        run: uv run --frozen python scripts/run_ci_unittests.py discover -s tests

  windows-unit-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Check runtime locks and binary wheels
        run: python scripts/dependency_report.py

      - name: Install locked dependencies
        run: uv sync --group dev --frozen

      - name: Verify automatic game-audio decoder setup
        run: uv run --frozen python -c "from vntts.game_audio_decoder import ensure_game_decoder; ensure_game_decoder(progress=print)"

      - name: Run Windows unit tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $testLog = Join-Path $env:RUNNER_TEMP "windows-unit-tests.log"
          uv run --frozen python scripts/run_ci_unittests.py discover -s tests *> $testLog
          $testStatus = $LASTEXITCODE
          $testOutput = [string](Get-Content -LiteralPath $testLog -Raw)
          $logToken = [guid]::NewGuid().ToString('N')
          Write-Output "::stop-commands::$logToken"
          Write-Output $testOutput
          Write-Output "::${logToken}::"
          if ($testStatus -ne 0) {
            $repoPythonFiles = @(git -C $env:GITHUB_WORKSPACE ls-files -- '*.py')
            $workspacePattern = [regex]::Escape($env:GITHUB_WORKSPACE.TrimEnd([char[]]'\/'))
            $framePattern = '^\s+File "' + $workspacePattern + '[\\/]([A-Za-z0-9_./\\-]+\.py)", line ([0-9]+), in .*$'
            $exceptionPattern = '^(AssertionError|AttributeError|FileNotFoundError|ImportError|' +
              'IndexError|KeyError|MemoryError|ModuleNotFoundError|OSError|OverflowError|' +
              'PermissionError|RecursionError|RuntimeError|TimeoutError|TypeError|' +
              'UnicodeDecodeError|UnicodeEncodeError|ValueError|ZeroDivisionError)(:|$)'
            $context = [Collections.Generic.List[string]]::new()
            foreach ($line in ($testOutput -split '\r?\n')) {
              if ($line -match $framePattern) {
                $repoPath = $Matches[1].Replace('\', '/')
                $lineNumber = 0
                if (($repoPythonFiles -contains $repoPath) -and [int]::TryParse($Matches[2], [ref]$lineNumber)) {
                  $sourceLines = @(Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $repoPath)).Count
                  if ($lineNumber -ge 1 -and $lineNumber -le $sourceLines) {
                    $context.Add("${repoPath}:${lineNumber}")
                  }
                }
              } elseif ($line -match $exceptionPattern) {
                $context.Add($Matches[1])
              } elseif ($line -match '^(?:Fatal Python error|Windows fatal exception): (Aborted|Segmentation fault|Access violation)$') {
                $context.Add($Matches[1])
              }
            }
            $summary = if ($context.Count) {
              ($context | Select-Object -Unique) -join '; '
            } else {
              'no structured failure context'
            }
            $summary = $summary.Substring(0, [Math]::Min(3500, $summary.Length))
            Write-Output "::error title=Windows unit tests failed::Runner exited with code ${testStatus}. ${summary}"
          }
          exit $testStatus

  linux-x11-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Check runtime locks and binary wheels
        run: python scripts/dependency_report.py

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng libegl1 libpipewire-0.3-0 libportaudio2 tesseract-ocr xvfb

      - name: Install locked dependencies
        run: uv sync --group dev --frozen

      - name: Verify automatic game-audio decoder setup
        run: uv run --frozen python -c "from vntts.game_audio_decoder import ensure_game_decoder; ensure_game_decoder(progress=print)"

      - name: Run Linux X11 source unit tests
        run: >-
          xvfb-run -a uv run --frozen python scripts/run_ci_unittests.py
          discover -s tests
