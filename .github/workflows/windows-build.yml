name: Windows portable build

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Require a trusted Authenticode signature
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install Tesseract
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          choco install espeak-ng --version=1.52.0 --yes --no-progress

      - name: Load signing certificate
        if: inputs.signed
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
              throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured."
          }
          $CertificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes(
              $CertificatePath,
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "VNTTS_SIGNING_CERTIFICATE_PATH=$CertificatePath" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and self-test portable application
        shell: powershell
        env:
          VNTTS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          VNTTS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          if ("${{ inputs.signed }}" -eq "true") {
              scripts\build-windows.ps1 -RequireSignature
          }
          else {
              scripts\build-windows.ps1
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: VisualNovelTextToSpeech-windows-x64
          path: |
            dist/VisualNovelTextToSpeech-windows-x64.zip
            dist/VisualNovelTextToSpeech-windows-x64.zip.sha256
            dist/VisualNovelTextToSpeech-windows-x64-self-test.json
          if-no-files-found: error

  verify-clean:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download portable application only
        uses: actions/download-artifact@v4
        with:
          name: VisualNovelTextToSpeech-windows-x64
          path: dist/verification

      - name: Verify checksum and standalone runtime
        shell: powershell
        run: |
          $Archive = Resolve-Path `
              "dist\verification\VisualNovelTextToSpeech-windows-x64.zip"
          $ChecksumFile = Resolve-Path "$Archive.sha256"
          $Expected = (Get-Content $ChecksumFile).Split()[0]
          $Actual = (Get-FileHash $Archive -Algorithm SHA256).Hash
          if ($Actual -ne $Expected) {
              throw "Portable bundle checksum does not match."
          }
          $Extracted = Join-Path $env:RUNNER_TEMP "vntts-portable"
          Expand-Archive -Path $Archive -DestinationPath $Extracted
          scripts\verify-windows-bundle.ps1 `
              -BundleDirectory `
                  (Join-Path $Extracted "VisualNovelTextToSpeech")
