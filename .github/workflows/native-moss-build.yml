name: Native MOSS timing build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/native/**
      - .github/workflows/native-moss-build.yml

permissions:
  contents: read

jobs:
  windows-vulkan:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # msvc-dev-cmd and gha-setup-ninja still declare Node 20 upstream.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: timing-adaptive
            pool: 'OFF'
            version: 0.3.0-vntts-timing1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: AlexRedby/openmoss
          ref: 3202d94ff125a30bd3a7c0dc16c9eb39b1ea0f2a
          submodules: recursive
          path: native-source
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 09913f088a1197aba4aefd300a876b2ebbaa3391
          path: spirv-headers
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      # Match upstream's Windows Vulkan SDK and portable CPU-thread-pool build.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
      - name: Build pinned VNTTS OpenMOSS fork
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C native-source rev-parse HEAD)" = 3202d94ff125a30bd3a7c0dc16c9eb39b1ea0f2a
          test "$(git -C native-source/third_party/llama.cpp rev-parse HEAD)" = 050ee92d04c2e1f639025786dea701c70e7d4204
          cmake -S spirv-headers -B spirv-build -DCMAKE_INSTALL_PREFIX="$PWD/spirv-install"
          cmake --build spirv-build --target install --config Release
          cmake -S native-source -B native-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_OPENMP=OFF \
            -DOPENMOSS_PERSISTENT_AUX_CPU_POOL=${{ matrix.pool }} \
            -DCMAKE_PREFIX_PATH="$PWD/spirv-install"
          cmake --build native-build --target moss-tts-server moss-aux-pool-check moss-local-gpu-check --parallel 2
          export PATH="$PWD/native-build/bin:$PATH"
          ctest --test-dir native-build -R '^moss-(aux-pool|local-gpu)-check$' --output-on-failure
      - name: Report native check failure
        if: failure()
        shell: pwsh
        run: |
          $Log = 'native-build/Testing/Temporary/LastTest.log'
          if (Test-Path $Log) {
            $Message = Get-Content $Log -Raw
            if ($Message.Length -gt 12000) { $Message = $Message.Substring($Message.Length - 12000) }
            $Message = $Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native graph check failed::$Message"
          }
      - name: Package and verify without model weights
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $Message = "$($_.Exception.Message) $($_.InvocationInfo.PositionMessage)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native package verification failed::$Message"
            throw
          }
          New-Item -ItemType Directory -Path native-dist | Out-Null
          Copy-Item native-build/moss-tts-server.exe native-dist/
          Copy-Item native-build/moss-aux-pool-check.exe native-dist/
          Copy-Item native-build/moss-local-gpu-check.exe native-dist/
          Copy-Item native-build/bin/*.dll native-dist/
          # SDK cache restores files, not the runner's system-wide Vulkan loader.
          # Ship the x64 runtime dependency beside the EXE, including its notices.
          $Runtime = Join-Path $env:VULKAN_SDK runtime
          Copy-Item "$Runtime/x64/vulkan-1.dll" native-dist/
          $Notices = @(Get-ChildItem $Runtime -File | Where-Object { $_.Name -match 'license|notice|copyright' })
          if ($Notices.Count -eq 0) { throw "Vulkan runtime notices missing from $Runtime" }
          New-Item -ItemType Directory -Path native-dist/vulkan-notices | Out-Null
          $Notices | Copy-Item -Destination native-dist/vulkan-notices/
          Copy-Item native-source/LICENSE native-dist/LICENSE-openmoss.txt
          Copy-Item native-source/third_party/llama.cpp/LICENSE native-dist/LICENSE-llama.cpp.txt
          Copy-Item native-source/third_party/llama.cpp/licenses native-dist/llama-licenses -Recurse
          Copy-Item native-source/third_party/llama.cpp/vendor/cpp-httplib/LICENSE native-dist/LICENSE-cpp-httplib.txt
          Copy-Item scripts/native/README.md native-dist/
          @{
            source = '3202d94ff125a30bd3a7c0dc16c9eb39b1ea0f2a'
            source_repository = 'AlexRedby/openmoss'
            upstream = 'bfb1f465e0a86fb5a52bbf93e67ceba4b7d0b4e1'
            llama = '050ee92d04c2e1f639025786dea701c70e7d4204'
            vntts = '${{ github.sha }}'
            variant = '${{ matrix.variant }}'
            persistent_aux_cpu_pool = '${{ matrix.pool }}'
            runtime_controls = @{
              local_gpu = $true
              aux_cpu_threads = @{ default = 4; minimum = 1; maximum = 16 }
              vulkan_optional = $true
              vulkan_available = 'runtime device enumeration'
              info_placement_device = 'selected backend device label; empty on CPU; max 128 chars'
            }
            persistent_pool_idle_poll = 0
            vulkan_runtime_sha256 = (Get-FileHash native-dist/vulkan-1.dll -Algorithm SHA256).Hash
            qualification = 'Build and no-model startup only; Windows GPU/audio qualification still required.'
          } | ConvertTo-Json | Set-Content native-dist/VNTTS-BUILD.json -Encoding utf8
          $Version = (& ./native-dist/moss-tts-server.exe --version | Out-String).Trim()
          $VersionExit = $LASTEXITCODE
          if ($VersionExit -ne 0 -or $Version -ne 'openmoss ${{ matrix.version }}') {
            $Dependencies = (& dumpbin /DEPENDENTS ./native-dist/moss-tts-server.exe | Out-String).Trim()
            $Files = (Get-ChildItem native-dist -File).Name -join ', '
            throw "Unexpected native build: '$Version'; exit=$VersionExit; files=$Files; imports=$Dependencies"
          }
          $Capabilities = (& ./native-dist/moss-tts-server.exe --capabilities-json | ConvertFrom-Json)
          if (
            $Capabilities.schema -ne 'vntts.openmoss.capabilities' -or
            $Capabilities.version -ne 1 -or
            $Capabilities.vulkan_optional -isnot [bool] -or
            -not $Capabilities.vulkan_optional -or
            $Capabilities.vulkan_available -isnot [bool] -or
            $Capabilities.local_gpu -isnot [bool] -or
            -not $Capabilities.local_gpu -or
            $Capabilities.aux_cpu_threads -isnot [bool] -or
            -not $Capabilities.aux_cpu_threads -or
            $Capabilities.aux_cpu_threads_default -ne 4 -or
            $Capabilities.aux_cpu_threads_min -ne 1 -or
            $Capabilities.aux_cpu_threads_max -ne 16
          ) { throw 'Native capability contract mismatch.' }
          $Help = (& ./native-dist/moss-tts-server.exe --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $Help -notmatch '--capabilities-json' -or
              $Help -notmatch '--local-gpu' -or $Help -notmatch '--aux-cpu-threads') {
            throw 'Native help/runtime-control contract mismatch.'
          }
          $Check = Start-Process -FilePath ./native-dist/moss-aux-pool-check.exe -PassThru -NoNewWindow -RedirectStandardOutput native-dist/aux-pool-check.json
          if (-not $Check.WaitForExit(120000)) {
            Stop-Process -Id $Check.Id -Force
            throw 'Packaged auxiliary pool check timed out.'
          }
          if ($Check.ExitCode -ne 0) { throw 'Packaged auxiliary pool check failed.' }
          $LocalCheck = Start-Process -FilePath ./native-dist/moss-local-gpu-check.exe -PassThru -NoNewWindow -RedirectStandardOutput native-dist/local-gpu-check.json
          if (-not $LocalCheck.WaitForExit(30000)) {
            Stop-Process -Id $LocalCheck.Id -Force
            throw 'Packaged Local GPU selection check timed out.'
          }
          if ($LocalCheck.ExitCode -ne 0) { throw 'Packaged Local GPU selection check failed.' }
          Compress-Archive -Path native-dist/* -DestinationPath moss-native-${{ matrix.variant }}-windows-x64.zip
          (Get-FileHash moss-native-${{ matrix.variant }}-windows-x64.zip -Algorithm SHA256).Hash |
            Set-Content moss-native-${{ matrix.variant }}-windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: moss-native-${{ matrix.variant }}-windows-x64
          path: |
            moss-native-${{ matrix.variant }}-windows-x64.zip
            moss-native-${{ matrix.variant }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
