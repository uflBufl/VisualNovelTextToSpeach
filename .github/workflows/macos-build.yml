name: macOS application build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install native dependencies
        run: brew install tesseract espeak-ng

      - name: Build and verify application
        run: scripts/build-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: VisualNovelTextToSpeech-macos
          path: |
            dist/VisualNovelTextToSpeech-macos-*.dmg
            dist/VisualNovelTextToSpeech-macos-*.dmg.sha256
            dist/VisualNovelTextToSpeech-macos-*-self-test.json
          if-no-files-found: error
