name: Windows installer

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Require a trusted Authenticode signature
        required: true
        type: boolean
        default: false

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install packaging tools
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          choco install espeak-ng --version=1.52.0 --yes --no-progress
          choco install innosetup --yes --no-progress

      - name: Build portable application
        shell: powershell
        run: scripts\build-windows.ps1

      - name: Load signing certificate
        if: inputs.signed
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
              throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured."
          }
          $CertificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes(
              $CertificatePath,
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          )
          "VNTTS_SIGNING_CERTIFICATE_PATH=$CertificatePath" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        env:
          VNTTS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          VNTTS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          if ("${{ inputs.signed }}" -eq "true") {
              scripts\build-windows-installer.ps1 -RequireSignature
          }
          else {
              scripts\build-windows-installer.ps1
          }

      - name: Verify install and uninstall
        shell: powershell
        run: |
          $Installer = Get-Item `
              "dist\VisualNovelTextToSpeech-*-windows-x64-setup.exe"
          if ("${{ inputs.signed }}" -eq "true") {
              scripts\verify-windows-installer.ps1 `
                  -InstallerPath $Installer.FullName
          }
          else {
              scripts\verify-windows-installer.ps1 `
                  -InstallerPath $Installer.FullName `
                  -AllowUnsigned
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VisualNovelTextToSpeech-windows-x64-installer
          path: dist/VisualNovelTextToSpeech-*-windows-x64-setup.exe
          if-no-files-found: error
