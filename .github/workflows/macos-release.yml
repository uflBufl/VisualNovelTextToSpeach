name: Signed and notarized macOS release

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: macOS package architecture
        required: true
        type: choice
        options:
          - arm64
          - x86_64

jobs:
  build-sign-notarize:
    runs-on: ${{ inputs.target_arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install native dependencies
        run: brew install tesseract espeak-ng

      - name: Import Developer ID certificate and notary credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APPLE_ID APP_PASSWORD TEAM_ID; do
            if [[ -z ${!value:-} ]]; then
              echo "Required macOS release secret is missing: $value" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/vntts-signing.keychain-db"
          certificate="$RUNNER_TEMP/vntts-developer-id.p12"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [[ -z $identity ]]; then
            echo "Developer ID Application identity was not imported." >&2
            exit 1
          fi
          xcrun notarytool store-credentials vntts-ci \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID"
          echo "VNTTS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "VNTTS_NOTARY_KEYCHAIN_PROFILE=vntts-ci" >> "$GITHUB_ENV"
          echo "VNTTS_MACOS_TARGET_ARCH=${{ inputs.target_arch }}" >> "$GITHUB_ENV"
          echo "VNTTS_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, and verify
        run: scripts/build-macos.sh

      - name: Upload signed macOS release
        uses: actions/upload-artifact@v4
        with:
          name: VisualNovelTextToSpeech-macos-${{ inputs.target_arch }}-signed
          path: |
            dist/VisualNovelTextToSpeech-macos-*.dmg
            dist/VisualNovelTextToSpeech-macos-*.dmg.sha256
            dist/VisualNovelTextToSpeech-macos-*-self-test.json
            dist/VisualNovelTextToSpeech-macos-*-notarization.json
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n ${VNTTS_RELEASE_KEYCHAIN:-} ]]; then
            security delete-keychain "$VNTTS_RELEASE_KEYCHAIN" || true
          fi
